[run]
platform = android
feature = malloc
flow = fs_login_battle
output_root = PerfData

[device]
id = 1C111FDF600AW5

[target]
app_id = com.tencent.dhwdxkty.trunk.profiler
launch_id = com.tencent.dhwdxkty.trunk.profiler/com.dhplugin.unity.MainActivity

[tools]
perfetto_root = ../../perfetto
trace_processor =
traceconv =
adb = adb
backend_python =

[rpc]
local_port = 12346
# Native heap 高负载下 App 主线程可能无法在 10 秒内处理 Poco 请求。
timeout_seconds = 30

[flow.fs_login_battle]
action_script = profile_actions/send_battle_record_gm.py

[feature.malloc]
interval_bytes = 1024
shmem_size_bytes = 8388608
trace_buffer_kib = 63488

[feature.mmap]
buffer_kib = 262144
smaps_interval_ms = 1000
perf_ring_buffer_pages = 32768
perf_ring_buffer_read_period_ms = 25
use_root_traced_perf = true
